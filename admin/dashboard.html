
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lotopy Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>
<style>/* ===========================
Lotopy Admin Dashboard
=========================== */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#F5F7FB;
}

.dashboard{
display:flex;
min-height:100vh;
}

/* Sidebar */

.sidebar{

width:260px;

background:#111827;

color:#fff;

padding:30px 20px;

position:fixed;

height:100vh;

left:0;

top:0;

}

.logo{

font-size:32px;

font-weight:800;

margin-bottom:45px;

}

.logo span{

color:#4F46E5;

}

.sidebar ul{

list-style:none;

padding:0;

}

.sidebar li{

padding:16px 18px;

margin-bottom:12px;

border-radius:12px;

cursor:pointer;

font-weight:500;

display:flex;

align-items:center;

gap:12px;

transition:.3s;

}

.sidebar li:hover{

background:#1F2937;

}

.sidebar li.active{

background:#4F46E5;

}

/* Main */

.main{

margin-left:260px;

flex:1;

padding:35px;

}

/* Topbar */

.topbar{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:35px;

}

.topbar h2{

font-size:34px;

font-weight:700;

margin-bottom:5px;

}

.topbar p{

color:#777;

margin:0;

}

.profile{

width:55px;

height:55px;

border-radius:50%;

background:white;

display:flex;

justify-content:center;

align-items:center;

font-size:30px;

box-shadow:0 8px 20px rgba(0,0,0,.08);

}

/* Welcome Card */

.welcome-card{

background:linear-gradient(135deg,#4F46E5,#6D5BFF);

border-radius:24px;

padding:40px;

color:white;

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:35px;

overflow:hidden;

}

.welcome-card h3{

font-size:32px;

font-weight:700;

margin-bottom:12px;

}

.welcome-card p{

opacity:.9;

margin-bottom:25px;

max-width:450px;

}

.new-btn{

background:white;

color:#4F46E5;

border:none;

padding:14px 30px;

border-radius:12px;

font-weight:600;

transition:.3s;

}

.new-btn:hover{

transform:translateY(-3px);

}

.hero-icon{

font-size:110px;

opacity:.25;

}

/* Stats */

.stats{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:25px;

}

.card-box{

background:white;

padding:30px;

border-radius:20px;

box-shadow:0 12px 30px rgba(0,0,0,.05);

transition:.3s;

}

.card-box:hover{

transform:translateY(-8px);

}

.card-box h4{

color:#666;

font-size:17px;

margin-bottom:10px;

}

.card-box h2{

font-size:42px;

font-weight:700;

margin:0;

color:#111827;

}

/* Responsive */

@media(max-width:991px){

.sidebar{

left:-260px;

}

.main{

margin-left:0;

padding:20px;

}

.stats{

grid-template-columns:1fr;

}

.welcome-card{

flex-direction:column;

text-align:center;

gap:30px;

}

.hero-icon{

font-size:80px;

}

}

@media(max-width:576px){

.topbar{

flex-direction:column;

align-items:flex-start;

gap:20px;

}

.welcome-card{

padding:25px;

}

.welcome-card h3{

font-size:24px;

}

.card-box{

padding:22px;

}

}
</style>
<body>

<div class="dashboard">

<!-- Sidebar -->

<div class="sidebar">

<div class="logo">

Loto<span>py</span>

</div>

<ul>

<li class="active">

<i class="bi bi-speedometer2"></i>

Dashboard

</li>

<li>

<i class="bi bi-plus-circle"></i>

New Blog

</li>

<li>

<i class="bi bi-file-earmark-text"></i>

All Blogs

</li>

<li>

<i class="bi bi-box-arrow-right"></i>

Logout

</li>

</ul>

</div>

<!-- Main -->

<div class="main">

<!-- Top -->

<div class="topbar">

<div>

<h2>

Dashboard

</h2>

<p>

Welcome Back 👋

</p>

</div>

<div class="profile">

<i class="bi bi-person-circle"></i>

</div>

</div>

<!-- Welcome Card -->

<div class="welcome-card">

<div>

<h3>

Welcome to Lotopy CMS

</h3>

<p>

Create, edit and publish blogs directly to GitHub.

</p>

<button class="new-btn">

<i class="bi bi-plus-circle"></i>

New Blog

</button>

</div>

<div>

<i class="bi bi-bar-chart-line-fill hero-icon"></i>

</div>

</div>

<!-- Stats -->

<div class="stats">

<div class="card-box">

<h4>

Total Blogs

</h4>

<h2>

0

</h2>

</div>

<div class="card-box">

<h4>

Published

</h4>

<h2>

0

</h2>

</div>

<div class="card-box">

<h4>

Draft

</h4>

<h2>

0

</h2>

</div>

</div>

</div>

</div>

</body>

</html>
