
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>New Blog | Lotopy</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>
  <style>/* ===========================
EDITOR PAGE
=========================== */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#F5F7FB;
color:#111827;
}

.editor-page{
padding:40px;
min-height:100vh;
}

/* Header */

.editor-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:35px;
}

.editor-header h2{
font-size:34px;
font-weight:700;
margin:0;
}

.back-btn{
display:inline-flex;
align-items:center;
gap:10px;
text-decoration:none;
background:#4F46E5;
color:#fff;
padding:12px 22px;
border-radius:12px;
font-weight:600;
transition:.3s;
}

.back-btn:hover{
background:#392fd4;
color:#fff;
transform:translateY(-2px);
}

/* Card */

.editor-card{
background:#fff;
border-radius:22px;
padding:35px;
box-shadow:0 15px 40px rgba(0,0,0,.06);
}

/* Labels */

.editor-card label{
display:block;
font-size:15px;
font-weight:600;
margin-bottom:10px;
color:#374151;
}

/* Inputs */

.form-control,
.form-select{

height:58px;

border-radius:14px;

border:1px solid #E5E7EB;

padding:0 18px;

font-size:15px;

box-shadow:none!important;

transition:.3s;

}

.form-control:focus,
.form-select:focus{

border-color:#4F46E5;

box-shadow:0 0 0 4px rgba(79,70,229,.12)!important;

}

.form-control[readonly]{

background:#F9FAFB;

cursor:not-allowed;

}

/* Responsive */

@media(max-width:991px){

.editor-page{

padding:20px;

}

.editor-header{

flex-direction:column;

align-items:flex-start;

gap:18px;

}

.editor-header h2{

font-size:28px;

}

.editor-card{

padding:22px;

}

}

@media(max-width:576px){

.back-btn{

width:100%;

justify-content:center;

}

.form-control,
.form-select{

height:54px;

}

}</style>

<body>

<div class="editor-page">

<div class="container-fluid">

<div class="editor-header">

<a href="dashboard.html" class="back-btn">

<i class="bi bi-arrow-left"></i>

Dashboard

</a>

<h2>

Create New Blog

</h2>

</div>

<div class="editor-card">

<div class="row">

<div class="col-lg-12">

<label>

Blog Title

</label>

<input

type="text"

id="title"

class="form-control"

placeholder="Enter blog title">

</div>

<div class="col-lg-6 mt-4">

<label>

Slug

</label>

<input

type="text"

id="slug"

class="form-control"

readonly>

</div>

<div class="col-lg-6 mt-4">

<label>

Category

</label>

<select

class="form-select"

id="category">

<option>

Select Category

</option>

<option>

Google Ads

</option>

<option>

SEO

</option>

<option>

Meta Ads

</option>

<option>

AI

</option>

<option>

Digital Marketing

</option>

</select>

</div>

</div>

</div>

</div>

</div>

<script src="js/editor.js"></script>

</body>

</html>
