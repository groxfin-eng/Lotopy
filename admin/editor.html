<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Blog | Lotopy CMS</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="editor-wrapper">

<div class="container-fluid">

<!-- Header -->

<div class="editor-top">

<div>

<a href="dashboard.html" class="back-btn">

<i class="bi bi-arrow-left"></i>

Dashboard

</a>

<h2>Create New Blog</h2>

<p>Create and publish a new article.</p>

</div>

<div class="editor-actions">

<button class="draft-btn">

Save Draft

</button>

<button class="publish-btn" id="publishBtn">

Publish

</button>

</div>

</div>

<!-- Basic Information -->

<div class="editor-card">

<h4>

Basic Information

</h4>

<div class="row">

<div class="col-lg-12">

<label>

Blog Title

</label>

<input

type="text"

id="title"

class="form-control"

placeholder="Enter Blog Title">

</div>

<div class="col-lg-6 mt-4">

<label>

Slug

</label>

<input

type="text"

id="slug"

class="form-control"

readonly>

</div>

<div class="col-lg-6 mt-4">

<label>

Category

</label>

<select

class="form-select"

id="category">

<option value="">

Select Category

</option>

<option>

Google Ads

</option>

<option>

SEO

</option>

<option>

Meta Ads

</option>

<option>

Digital Marketing

</option>

<option>

AI

</option>

<option>

Case Study

</option>

</select>

</div>

</div>

</div>
<!-- Featured Image & Description -->

<div class="editor-card mt-4">

<h4>

Featured Image

</h4>

<div class="upload-box" id="uploadBox">

<input
type="file"
id="featuredImage"
accept="image/*"
hidden>

<i class="bi bi-cloud-arrow-up"></i>

<h5>

Upload Featured Image

</h5>

<p>

Click here or Drag & Drop

</p>

<button
type="button"
class="upload-btn"
onclick="document.getElementById('featuredImage').click()">

Choose Image

</button>

<img
id="previewImage"
alt="Preview">

</div>

</div>

<!-- Short Description -->

<div class="editor-card mt-4">

<h4>

Short Description

</h4>

<textarea

id="description"

maxlength="200"

placeholder="Write a short description for your blog...">

</textarea>

<div class="char-count">

<span id="charCounter">

0

</span>

/ 200 Characters

</div>

</div>
<!-- PART 2 YAHAN SE SHURU HOGA -->

</div>

</div>

<script src="js/editor.js"></script>

</body>

</html>
