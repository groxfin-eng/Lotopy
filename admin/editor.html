<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Blog | Lotopy CMS</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>
<style>/* ======================
Featured Image
====================== */

.upload-box{

border:2px dashed #D8DCE8;

border-radius:20px;

padding:45px;

text-align:center;

background:#FBFBFE;

transition:.3s;

position:relative;

cursor:pointer;

}

.upload-box:hover{

border-color:#4F46E5;

background:#EEF2FF;

}

.upload-box i{

font-size:65px;

color:#4F46E5;

margin-bottom:15px;

display:block;

}

.upload-box h5{

font-weight:700;

margin-bottom:8px;

}

.upload-box p{

color:#777;

margin-bottom:20px;

}

.upload-btn{

border:none;

background:#4F46E5;

color:white;

padding:12px 28px;

border-radius:12px;

font-weight:600;

}

#previewImage{

width:100%;

max-height:320px;

object-fit:cover;

border-radius:16px;

margin-top:25px;

display:none;

}

textarea{

width:100%;

height:180px;

border:1px solid #ddd;

border-radius:16px;

padding:18px;

resize:none;

outline:none;

margin-top:15px;

}

textarea:focus{

border-color:#4F46E5;

}

.char-count{

text-align:right;

margin-top:12px;

color:#777;

font-size:14px;

}</style>
<body>

<div class="editor-wrapper">

<div class="container-fluid">

<!-- Header -->

<div class="editor-top">

<div>

<a href="dashboard.html" class="back-btn">

<i class="bi bi-arrow-left"></i>

Dashboard

</a>

<h2>Create New Blog</h2>

<p>Create and publish a new article.</p>

</div>

<div class="editor-actions">

<button class="draft-btn">

Save Draft

</button>

<button class="publish-btn" id="publishBtn">

Publish

</button>

</div>

</div>

<!-- Basic Information -->

<div class="editor-card">

<h4>

Basic Information

</h4>

<div class="row">

<div class="col-lg-12">

<label>

Blog Title

</label>

<input

type="text"

id="title"

class="form-control"

placeholder="Enter Blog Title">

</div>

<div class="col-lg-6 mt-4">

<label>

Slug

</label>

<input

type="text"

id="slug"

class="form-control"

readonly>

</div>

<div class="col-lg-6 mt-4">

<label>

Category

</label>

<select

class="form-select"

id="category">

<option value="">

Select Category

</option>

<option>

Google Ads

</option>

<option>

SEO

</option>

<option>

Meta Ads

</option>

<option>

Digital Marketing

</option>

<option>

AI

</option>

<option>

Case Study

</option>

</select>

</div>

</div>

</div>
<!-- Featured Image & Description -->

<div class="editor-card mt-4">

<h4>

Featured Image

</h4>

<div class="upload-box" id="uploadBox">

<input
type="file"
id="featuredImage"
accept="image/*"
hidden>

<i class="bi bi-cloud-arrow-up"></i>

<h5>

Upload Featured Image

</h5>

<p>

Click here or Drag & Drop

</p>

<button
type="button"
class="upload-btn"
onclick="document.getElementById('featuredImage').click()">

Choose Image

</button>

<img
id="previewImage"
alt="Preview">

</div>

</div>

<!-- Short Description -->

<div class="editor-card mt-4">

<h4>

Short Description

</h4>

<textarea

id="description"

maxlength="200"

placeholder="Write a short description for your blog...">

</textarea>

<div class="char-count">

<span id="charCounter">

0

</span>

/ 200 Characters

</div>

</div>
<!-- PART 2 YAHAN SE SHURU HOGA -->

</div>

</div>

<script>/* Image Preview */

const imageInput=document.getElementById("featuredImage");

if(imageInput){

imageInput.addEventListener("change",function(){

const file=this.files[0];

if(file){

const reader=new FileReader();

reader.onload=function(e){

const img=document.getElementById("previewImage");

img.src=e.target.result;

img.style.display="block";

};

reader.readAsDataURL(file);

}

});

}

/* Character Counter */

const description=document.getElementById("description");

if(description){

description.addEventListener("input",function(){

document.getElementById("charCounter").innerHTML=this.value.length;

});

}</script>

</body>

</html>
